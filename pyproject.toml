[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambiguity-manager"
version = "0.0.0"
description = "Risk-Aware Ambiguity Manager: natural-language coordination layer for ambiguous robot/user commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
audit = [
    "pyarrow>=14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
